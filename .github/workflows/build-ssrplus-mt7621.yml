name: Build SSR-Plus Official + Cooluc Deps (MT7621 / OpenWrt 22.03)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ssrplus-mt7621.yml'

permissions:
  contents: write

env:
  ARCH: mipsel_24kc
  COOLUC_URL: https://opkg.cooluc.com/openwrt-24.10/mipsel_24kc
  OWRT_PKG_URL: https://downloads.openwrt.org/releases/22.03.4/packages/mipsel_24kc
  OWRT_BASE_URL: https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621/packages
  OUTPUT_NAME: ssrplus-mt7621-lite.run
  RELEASE_TAG: latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip makeself python3

      - name: 2. 打包官方主程序/中文包 + 从 cooluc 拉取核心与全量依赖
        run: |
          set -euo pipefail
          WORK_DIR="${GITHUB_WORKSPACE}/build_tmp"
          PKG_DIR="${WORK_DIR}/payload"
          SSR_BUILD="${WORK_DIR}/ssr_ipk"
          ZH_BUILD="${WORK_DIR}/zh_ipk"
          IDX_DIR="${WORK_DIR}/indices"

          mkdir -p "${PKG_DIR}/ipks" "${IDX_DIR}" \
                   "${SSR_BUILD}/data" "${SSR_BUILD}/control" \
                   "${ZH_BUILD}/data/usr/lib/lua/luci/i18n" "${ZH_BUILD}/control"

          # 2.1 从 cooluc 源（优先）及 OpenWrt 22.03.4 官方源递归拉取 xray-core 与全部用户态依赖
          curl -fsSL "${COOLUC_URL}/Packages.gz" | gunzip > "${IDX_DIR}/cooluc.idx"
          for feed in base luci packages routing telephony; do
            curl -fsSL "${OWRT_PKG_URL}/${feed}/Packages.gz" | gunzip > "${IDX_DIR}/${feed}.idx"
          done
          curl -fsSL "${OWRT_BASE_URL}/Packages.gz" | gunzip > "${IDX_DIR}/target.idx"

          python3 - "${IDX_DIR}" "${PKG_DIR}/ipks" "${COOLUC_URL}" "${OWRT_PKG_URL}" "${OWRT_BASE_URL}" << 'PYEOF'
          import sys, os, re, urllib.request

          idx_dir, out_dir, cooluc_url, owrt_pkg_url, owrt_base_url = sys.argv[1:6]

          sources = [
              ("cooluc.idx", cooluc_url),
              ("luci.idx", f"{owrt_pkg_url}/luci"),
              ("packages.idx", f"{owrt_pkg_url}/packages"),
              ("base.idx", f"{owrt_pkg_url}/base"),
              ("routing.idx", f"{owrt_pkg_url}/routing"),
              ("target.idx", owrt_base_url),
          ]

          # 跳过系统基础库、24.10 过渡包 luci-lua-runtime 与内核模块（kmod 由路由器官方源匹配内核安装）
          SKIP_PKGS = {
              "libc", "libgcc1", "libpthread", "librt", "zlib",
              "kernel", "base-files", "busybox", "uci", "ubus", "ubox", "rpcd",
              "uhttpd", "luci-base", "luci-mod-admin-full", "luci-lua-runtime",
              "lua", "libuci-lua", "libubus-lua", "libnixio", "ca-bundle", "ca-certificates"
          }

          pkg_map = {}
          for fname, base_url in sources:
              fpath = os.path.join(idx_dir, fname)
              if not os.path.exists(fpath):
                  continue
              cur = {}
              with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.rstrip("\n")
                      if not line:
                          if "Package" in cur and "Filename" in cur:
                              name = cur["Package"]
                              if name not in pkg_map:
                                  pkg_map[name] = (base_url, cur["Filename"], cur.get("Depends", ""))
                          cur = {}
                      elif ": " in line:
                          k, v = line.split(": ", 1)
                          cur[k] = v

          ROOT_DEPS = [
              "xray-core", "luci-compat", "luci-lib-ipkg", "luci-lib-jsonc",
              "lua-neturl", "lyaml", "coreutils-base64", "curl",
              "ipset", "resolveip", "ipt2socks", "dns2tcp", "microsocks"
          ]

          visited = set()
          queue = list(ROOT_DEPS)

          while queue:
              pkg = queue.pop(0).strip()
              if not pkg or pkg in visited or pkg in SKIP_PKGS or pkg.startswith("kmod-"):
                  continue
              visited.add(pkg)
              if pkg not in pkg_map:
                  print(f"[WARN] 未在索引中找到: {pkg}")
                  continue
              base_url, rel_file, deps_str = pkg_map[pkg]
              dl_url = f"{base_url}/{rel_file}"
              safe_name = re.sub(r'[^a-zA-Z0-9._-]', '_', os.path.basename(rel_file))
              dst_file = os.path.join(out_dir, safe_name)
              print(f"[FETCH] {pkg} -> {safe_name}")
              urllib.request.urlretrieve(dl_url, dst_file)

              for raw_dep in deps_str.split(","):
                  dep = raw_dep.strip().split(" ")[0].split("(")[0].strip()
                  if dep and dep not in visited:
                      queue.append(dep)
          PYEOF

          # 2.2 拉取 fw876/helloworld 官方源码
          curl -fSL "https://github.com/fw876/helloworld/archive/refs/heads/master.tar.gz" -o "${WORK_DIR}/helloworld.tar.gz"
          tar -xzf "${WORK_DIR}/helloworld.tar.gz" -C "${WORK_DIR}"

          SRC_SSR="${WORK_DIR}/helloworld-master/luci-app-ssr-plus"
          DST_SSR="${SSR_BUILD}/data"
          SSR_REV=$(date +'%Y%m%d.%H%M')

          mkdir -p "${DST_SSR}/usr/lib/lua/luci"
          cp -rf "${SRC_SSR}/root/"* "${DST_SSR}/"
          cp -rf "${SRC_SSR}/luasrc/"* "${DST_SSR}/usr/lib/lua/luci/"

          # 2.3 封装主程序 luci-app-ssr-plus IPK（显式声明 kmod-nft-socket 与 kmod-nft-tproxy）
          cat << EOF > "${SSR_BUILD}/control/control"
          Package: luci-app-ssr-plus
          Version: 99.0-${SSR_REV}
          Architecture: all
          Depends: luci-compat, luci-lib-ipkg, luci-lib-jsonc, lua-neturl, lyaml, coreutils-base64, curl, ipset, resolveip, ipt2socks, dns2tcp, microsocks, kmod-nft-socket, kmod-nft-tproxy, xray-core
          Maintainer: fw876-official
          Section: luci
          Priority: optional
          Description: ShadowSocksR Plus+ LuCI interface (Official Source)
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/control"

          cat << 'EOF' > "${SSR_BUILD}/control/postinst"
          #!/bin/sh
          [ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0
          chmod +x /etc/init.d/shadowsocksr /usr/share/shadowsocksr/*.sh /usr/share/shadowsocksr/*.lua 2>/dev/null || true
          if [ -f /etc/uci-defaults/luci-ssr-plus ]; then
              sh /etc/uci-defaults/luci-ssr-plus && rm -f /etc/uci-defaults/luci-ssr-plus
          fi
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache/*
          /etc/init.d/shadowsocksr enable 2>/dev/null || true
          exit 0
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/postinst"

          cat << 'EOF' > "${SSR_BUILD}/control/prerm"
          #!/bin/sh
          /etc/init.d/shadowsocksr stop 2>/dev/null || true
          /etc/init.d/shadowsocksr disable 2>/dev/null || true
          exit 0
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/prerm"
          chmod 755 "${SSR_BUILD}/control/postinst" "${SSR_BUILD}/control/prerm"

          echo "2.0" > "${SSR_BUILD}/debian-binary"
          tar --numeric-owner --owner=0 --group=0 -czf "${SSR_BUILD}/data.tar.gz" -C "${SSR_BUILD}/data" .
          tar --numeric-owner --owner=0 --group=0 -czf "${SSR_BUILD}/control.tar.gz" -C "${SSR_BUILD}/control" .
          tar --numeric-owner --owner=0 --group=0 -czf "${PKG_DIR}/ipks/luci-app-ssr-plus_99.0-${SSR_REV}_all.ipk" -C "${SSR_BUILD}" debian-binary control.tar.gz data.tar.gz

          # 2.4 编译官方简体中文 .lmo 并封装独立中文包 luci-i18n-ssr-plus-zh-cn IPK
          python3 - "${SRC_SSR}/po/zh-cn/ssr-plus.po" "${ZH_BUILD}/data/usr/lib/lua/luci/i18n/ssr-plus.zh-cn.lmo" << 'PYEOF'
          import sys, struct

          def sfh_hash(data):
              length = len(data)
              if length == 0:
                  return 0
              h = length & 0xFFFFFFFF
              rem = length & 3
              n = length >> 2
              idx = 0
              for _ in range(n):
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  tmp = (((data[idx+2] | (data[idx+3] << 8)) << 11) ^ h) & 0xFFFFFFFF
                  h = ((h << 16) ^ tmp) & 0xFFFFFFFF
                  h = (h + (h >> 11)) & 0xFFFFFFFF
                  idx += 4
              if rem == 3:
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  h = (h ^ (h << 16)) & 0xFFFFFFFF
                  h = (h ^ (data[idx+2] << 18)) & 0xFFFFFFFF
                  h = (h + (h >> 11)) & 0xFFFFFFFF
              elif rem == 2:
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  h = (h ^ (h << 11)) & 0xFFFFFFFF
                  h = (h + (h >> 17)) & 0xFFFFFFFF
              elif rem == 1:
                  h = (h + data[idx]) & 0xFFFFFFFF
                  h = (h ^ (h << 10)) & 0xFFFFFFFF
                  h = (h + (h >> 1)) & 0xFFFFFFFF
              h = (h ^ (h << 3)) & 0xFFFFFFFF
              h = (h + (h >> 5)) & 0xFFFFFFFF
              h = (h ^ (h << 4)) & 0xFFFFFFFF
              h = (h + (h >> 17)) & 0xFFFFFFFF
              h = (h ^ (h << 25)) & 0xFFFFFFFF
              h = (h + (h >> 6)) & 0xFFFFFFFF
              return h

          def unescape(s):
              return s.replace('\\n', '\n').replace('\\t', '\t').replace('\\"', '"').replace('\\\\', '\\')

          po_file, lmo_file = sys.argv[1], sys.argv[2]
          entries = {}
          cur_id, cur_str, mode = [], [], None
          with open(po_file, 'r', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if line.startswith('msgid '):
                      if cur_id and cur_str:
                          k = unescape(''.join(cur_id))
                          v = unescape(''.join(cur_str))
                          if k and v:
                              entries[k] = v
                      cur_id, cur_str, mode = [line[7:-1]], [], 'id'
                  elif line.startswith('msgstr '):
                      cur_str, mode = [line[8:-1]], 'str'
                  elif line.startswith('"') and line.endswith('"'):
                      if mode == 'id':
                          cur_id.append(line[1:-1])
                      elif mode == 'str':
                          cur_str.append(line[1:-1])
              if cur_id and cur_str:
                  k = unescape(''.join(cur_id))
                  v = unescape(''.join(cur_str))
                  if k and v:
                      entries[k] = v

          out = bytearray()
          index = []
          for k, v in entries.items():
              vb = v.encode('utf-8')
              offset = len(out)
              out.extend(vb)
              pad = (4 - (len(vb) % 4)) % 4
              out.extend(b'\x00' * pad)
              index.append((sfh_hash(k.encode('utf-8')), 0xFFFFFFFF, offset, len(vb)))

          index.sort(key=lambda x: x[0])
          idx_offset = len(out)
          for rec in index:
              out.extend(struct.pack('>IIII', *rec))
          out.extend(struct.pack('>I', idx_offset))
          with open(lmo_file, 'wb') as f:
              f.write(out)
          PYEOF

          cat << EOF > "${ZH_BUILD}/control/control"
          Package: luci-i18n-ssr-plus-zh-cn
          Version: 99.0-${SSR_REV}
          Architecture: all
          Depends: luci-app-ssr-plus
          Maintainer: fw876-official
          Section: luci
          Priority: optional
          Description: Translation for luci-app-ssr-plus - 简体中文 (Chinese)
          EOF
          sed -i 's/^          //' "${ZH_BUILD}/control/control"

          echo "2.0" > "${ZH_BUILD}/debian-binary"
          tar --numeric-owner --owner=0 --group=0 -czf "${ZH_BUILD}/data.tar.gz" -C "${ZH_BUILD}/data" .
          tar --numeric-owner --owner=0 --group=0 -czf "${ZH_BUILD}/control.tar.gz" -C "${ZH_BUILD}/control" .
          tar --numeric-owner --owner=0 --group=0 -czf "${PKG_DIR}/ipks/luci-i18n-ssr-plus-zh-cn_99.0-${SSR_REV}_all.ipk" -C "${ZH_BUILD}" debian-binary control.tar.gz data.tar.gz

          echo "PKG_LIST=$(ls -1 "${PKG_DIR}/ipks" | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: 3. 生成安装脚本并封装 Makeself
        run: |
          set -euo pipefail
          PKG_DIR="${GITHUB_WORKSPACE}/build_tmp/payload"

          sed 's/^          //' << 'EOF' > "${PKG_DIR}/install.sh"
          #!/bin/sh
          set -e

          echo ">>> [1/3] 检查并从官方源补齐内核模块 (kmod-nft-socket / kmod-nft-tproxy)..."
          if ! opkg list-installed | grep -q "^kmod-nft-socket " || ! opkg list-installed | grep -q "^kmod-nft-tproxy "; then
              opkg update || true
              opkg install kmod-nft-socket kmod-nft-tproxy
          fi

          echo ">>> [2/3] 离线安装全部 IPK（官方主程序 + 中文包 + cooluc 核心与全量依赖）..."
          opkg install ./ipks/*.ipk --force-overwrite --force-reinstall --force-downgrade

          echo ">>> [3/3] 刷新 LuCI 缓存..."
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache/*
          /etc/init.d/rpcd restart 2>/dev/null || true
          echo "安装完成！请在后台：服务 -> ShadowSocksR Plus+ 更新订阅并选择节点。"
          EOF

          chmod +x "${PKG_DIR}/install.sh"
          makeself --gzip "${PKG_DIR}" "${GITHUB_WORKSPACE}/${OUTPUT_NAME}" "SSR-Plus Official MT7621" ./install.sh

      - name: 4. 清理旧的 Release 与 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${RELEASE_TAG}" 2>/dev/null || true

      - name: 5. 发布单版到 GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SSR-Plus Official + Cooluc Deps MT7621 (Latest)"
          body: |
            - **构建时间**：`${{ env.BUILD_TIME }}`
            - **内嵌全量 IPK**：`${{ env.PKG_LIST }}`
            - **打包结构**：官方 `fw876/helloworld` 主程序与独立中文包 + `cooluc` 源 `xray-core` 与全量用户态依赖，安装时自动由路由器官方源补齐 `kmod-nft-socket` 和 `kmod-nft-tproxy`。
          files: |
            ${{ github.workspace }}/${{ env.OUTPUT_NAME }}
