name: Build SSR-Plus Lite (MT7621 / OpenWrt 22.03)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ssrplus-mt7621.yml'

permissions:
  contents: write

env:
  ARCH: mipsel_24kc
  OPENWRT_VER: 22.03.4
  OUTPUT_NAME: ssrplus-mt7621-lite.run
  RELEASE_TAG: latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar unzip jq makeself python3

      - name: 2. 构建双标准 IPK (luci-app-ssr-plus + xray-core) 与运行依赖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK_DIR="${GITHUB_WORKSPACE}/build_tmp"
          PKG_DIR="${WORK_DIR}/payload"
          IDX_DIR="${WORK_DIR}/indices"
          SSR_BUILD="${WORK_DIR}/ssr_ipk"
          XRAY_BUILD="${WORK_DIR}/xray_ipk"

          mkdir -p "${PKG_DIR}/ipks" "${IDX_DIR}" \
                   "${SSR_BUILD}/data/usr/lib/lua/luci/i18n" "${SSR_BUILD}/control" \
                   "${XRAY_BUILD}/data/usr/bin" "${XRAY_BUILD}/control"

          # 2.1 拉取并深度裁剪 luci-app-ssr-plus 源码
          curl -fSL "https://github.com/fw876/helloworld/archive/refs/heads/master.tar.gz" -o "${WORK_DIR}/helloworld.tar.gz"
          tar -xzf "${WORK_DIR}/helloworld.tar.gz" -C "${WORK_DIR}"

          SRC_SSR="${WORK_DIR}/helloworld-master/luci-app-ssr-plus"
          DST_SSR="${SSR_BUILD}/data"

          cp -rf "${SRC_SSR}/root/"* "${DST_SSR}/"
          cp -rf "${SRC_SSR}/luasrc/"* "${DST_SSR}/usr/lib/lua/luci/"

          # 内置 url.lua 并严格校验文件大小（防止空文件打入包内）
          curl -fSL "https://raw.githubusercontent.com/lunarmodules/luasocket/master/src/url.lua" -o "${DST_SSR}/usr/lib/lua/url.lua"
          test -s "${DST_SSR}/usr/lib/lua/url.lua"
          [ "$(wc -c < "${DST_SSR}/usr/lib/lua/url.lua")" -gt 5000 ]

          # 编译简体中文 .lmo 语言包
          python3 - "${SRC_SSR}/po/zh-cn/ssr-plus.po" "${DST_SSR}/usr/lib/lua/luci/i18n/ssr-plus.zh-cn.lmo" << 'PYEOF'
          import sys, struct

          def sfh_hash(data):
              length = len(data)
              if length == 0:
                  return 0
              h = length & 0xFFFFFFFF
              rem = length & 3
              n = length >> 2
              idx = 0
              for _ in range(n):
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  tmp = (((data[idx+2] | (data[idx+3] << 8)) << 11) ^ h) & 0xFFFFFFFF
                  h = ((h << 16) ^ tmp) & 0xFFFFFFFF
                  h = (h + (h >> 11)) & 0xFFFFFFFF
                  idx += 4
              if rem == 3:
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  h = (h ^ (h << 16)) & 0xFFFFFFFF
                  h = (h ^ (data[idx+2] << 18)) & 0xFFFFFFFF
                  h = (h + (h >> 11)) & 0xFFFFFFFF
              elif rem == 2:
                  h = (h + (data[idx] | (data[idx+1] << 8))) & 0xFFFFFFFF
                  h = (h ^ (h << 11)) & 0xFFFFFFFF
                  h = (h + (h >> 17)) & 0xFFFFFFFF
              elif rem == 1:
                  h = (h + data[idx]) & 0xFFFFFFFF
                  h = (h ^ (h << 10)) & 0xFFFFFFFF
                  h = (h + (h >> 1)) & 0xFFFFFFFF
              h = (h ^ (h << 3)) & 0xFFFFFFFF
              h = (h + (h >> 5)) & 0xFFFFFFFF
              h = (h ^ (h << 4)) & 0xFFFFFFFF
              h = (h + (h >> 17)) & 0xFFFFFFFF
              h = (h ^ (h << 25)) & 0xFFFFFFFF
              h = (h + (h >> 6)) & 0xFFFFFFFF
              return h

          def unescape(s):
              return s.replace('\\n', '\n').replace('\\t', '\t').replace('\\"', '"').replace('\\\\', '\\')

          po_file, lmo_file = sys.argv[1], sys.argv[2]
          entries = {}
          cur_id, cur_str, mode = [], [], None
          with open(po_file, 'r', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if line.startswith('msgid '):
                      if cur_id and cur_str:
                          k = unescape(''.join(cur_id))
                          v = unescape(''.join(cur_str))
                          if k and v:
                              entries[k] = v
                      cur_id, cur_str, mode = [line[7:-1]], [], 'id'
                  elif line.startswith('msgstr '):
                      cur_str, mode = [line[8:-1]], 'str'
                  elif line.startswith('"') and line.endswith('"'):
                      if mode == 'id':
                          cur_id.append(line[1:-1])
                      elif mode == 'str':
                          cur_str.append(line[1:-1])
              if cur_id and cur_str:
                  k = unescape(''.join(cur_id))
                  v = unescape(''.join(cur_str))
                  if k and v:
                      entries[k] = v

          out = bytearray()
          index = []
          for k, v in entries.items():
              vb = v.encode('utf-8')
              offset = len(out)
              out.extend(vb)
              pad = (4 - (len(vb) % 4)) % 4
              out.extend(b'\x00' * pad)
              index.append((sfh_hash(k.encode('utf-8')), 0xFFFFFFFF, offset, len(vb)))

          index.sort(key=lambda x: x[0])
          idx_offset = len(out)
          for rec in index:
              out.extend(struct.pack('>IIII', *rec))
          out.extend(struct.pack('>I', idx_offset))
          with open(lmo_file, 'wb') as f:
              f.write(out)
          PYEOF

          # 删除服务端与冗余规则（务必保留 gen_config.lua 用于生成 Xray 节点配置）
          rm -f "${DST_SSR}/usr/lib/lua/luci/model/cbi/shadowsocksr/server.lua" \
                "${DST_SSR}/usr/lib/lua/luci/model/cbi/shadowsocksr/server-config.lua" \
                "${DST_SSR}/usr/share/shadowsocksr/netflix_check.sh" \
                "${DST_SSR}/usr/share/shadowsocksr/gfw2ipset.sh" 2>/dev/null || true

          find "${DST_SSR}/etc/shadowsocksr" -type f \( -name "*ad*" -o -name "*netflix*" -o -name "*disney*" \) -delete 2>/dev/null || true

          # 2.2 封装标准 luci-app-ssr-plus IPK
          SSR_REV=$(date +'%Y%m%d.%H%M')
          cat << EOF > "${SSR_BUILD}/control/control"
          Package: luci-app-ssr-plus
          Version: 1.0-${SSR_REV}-lite
          Architecture: all
          Maintainer: custom-lite
          Section: luci
          Priority: optional
          Description: Lightweight ShadowSocksR Plus+ (zh-cn) for MT7621
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/control"

          cat << 'EOF' > "${SSR_BUILD}/control/postinst"
          #!/bin/sh
          [ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0
          chmod +x /etc/init.d/shadowsocksr /usr/share/shadowsocksr/*.sh /usr/share/shadowsocksr/*.lua 2>/dev/null || true
          if [ -f /etc/uci-defaults/luci-ssr-plus ]; then
              sh /etc/uci-defaults/luci-ssr-plus && rm -f /etc/uci-defaults/luci-ssr-plus
          fi
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache/*
          /etc/init.d/shadowsocksr enable 2>/dev/null || true
          exit 0
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/postinst"

          cat << 'EOF' > "${SSR_BUILD}/control/prerm"
          #!/bin/sh
          /etc/init.d/shadowsocksr stop 2>/dev/null || true
          /etc/init.d/shadowsocksr disable 2>/dev/null || true
          exit 0
          EOF
          sed -i 's/^          //' "${SSR_BUILD}/control/prerm"
          chmod 755 "${SSR_BUILD}/control/postinst" "${SSR_BUILD}/control/prerm"

          echo "2.0" > "${SSR_BUILD}/debian-binary"
          tar --numeric-owner --owner=0 --group=0 -czf "${SSR_BUILD}/data.tar.gz" -C "${SSR_BUILD}/data" .
          tar --numeric-owner --owner=0 --group=0 -czf "${SSR_BUILD}/control.tar.gz" -C "${SSR_BUILD}/control" .
          tar --numeric-owner --owner=0 --group=0 -czf "${PKG_DIR}/ipks/luci-app-ssr-plus_1.0-${SSR_REV}-lite_all.ipk" -C "${SSR_BUILD}" debian-binary control.tar.gz data.tar.gz

          # 2.3 获取 Xray-core（优先软浮点版，解决 MT7621 无 FPU 报 Illegal instruction）
          XRAY_JSON=$(curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/XTLS/Xray-core/releases/latest")
          XRAY_VER=$(echo "$XRAY_JSON" | jq -r '.tag_name' | sed 's/^v//')
          XRAY_URL=$(echo "$XRAY_JSON" | jq -r '.assets[] | select(.name | test("Xray-linux-mips32le-softfloat\\.zip$")) | .browser_download_url' | head -n 1)
          if [ -z "$XRAY_URL" ]; then
            XRAY_URL=$(echo "$XRAY_JSON" | jq -r '.assets[] | select(.name | test("Xray-linux-mips32le\\.zip$")) | .browser_download_url' | head -n 1)
          fi
          curl -fSL "$XRAY_URL" -o "${WORK_DIR}/xray.zip"
          if unzip -l "${WORK_DIR}/xray.zip" | grep -q "xray_softfloat"; then
            unzip -q "${WORK_DIR}/xray.zip" xray_softfloat -d "${XRAY_BUILD}/data/usr/bin/"
            mv "${XRAY_BUILD}/data/usr/bin/xray_softfloat" "${XRAY_BUILD}/data/usr/bin/xray"
          else
            unzip -q "${WORK_DIR}/xray.zip" xray -d "${XRAY_BUILD}/data/usr/bin/"
          fi
          chmod 755 "${XRAY_BUILD}/data/usr/bin/xray"
          ln -sf /usr/bin/xray "${XRAY_BUILD}/data/usr/bin/trojan"

          cat << EOF > "${XRAY_BUILD}/control/control"
          Package: xray-core
          Version: ${XRAY_VER}-1
          Architecture: ${ARCH}
          Maintainer: custom-lite
          Section: net
          Priority: optional
          Description: Xray-core softfloat binary (VLESS/VMess/Reality/Trojan/Hy2) for MT7621
          EOF
          sed -i 's/^          //' "${XRAY_BUILD}/control/control"

          echo "2.0" > "${XRAY_BUILD}/debian-binary"
          tar --numeric-owner --owner=0 --group=0 -czf "${XRAY_BUILD}/data.tar.gz" -C "${XRAY_BUILD}/data" .
          tar --numeric-owner --owner=0 --group=0 -czf "${XRAY_BUILD}/control.tar.gz" -C "${XRAY_BUILD}/control" .
          tar --numeric-owner --owner=0 --group=0 -czf "${PKG_DIR}/ipks/xray-core_${XRAY_VER}-1_${ARCH}.ipk" -C "${XRAY_BUILD}" debian-binary control.tar.gz data.tar.gz

          # 2.4 下载 OpenWrt 22.03.4 用户态依赖（严禁打包 curl/libcurl4，直接复用原厂环境）
          BASE_FEED="https://archive.openwrt.org/releases/${OPENWRT_VER}/packages/${ARCH}"
          curl -fSL "${BASE_FEED}/base/Packages" -o "${IDX_DIR}/base.idx"
          curl -fSL "${BASE_FEED}/packages/Packages" -o "${IDX_DIR}/packages.idx"
          curl -fSL "${BASE_FEED}/luci/Packages" -o "${IDX_DIR}/luci.idx"

          fetch_ipk() {
            local pkg_name="$1"
            local idx_file url_base pkg_file
            for pair in \
              "${IDX_DIR}/base.idx|${BASE_FEED}/base" \
              "${IDX_DIR}/packages.idx|${BASE_FEED}/packages" \
              "${IDX_DIR}/luci.idx|${BASE_FEED}/luci"; do
              idx_file="${pair%%|*}"
              url_base="${pair##*|}"
              pkg_file=$(awk -v p="$pkg_name" '$1=="Package:" && $2==p {found=1; next} found && $1=="Filename:" {print $2; exit} found && /^$/ {found=0}' "$idx_file")
              if [ -n "$pkg_file" ]; then
                echo "  -> Downloading ${pkg_file}"
                curl -fSL "${url_base}/${pkg_file}" -o "${PKG_DIR}/ipks/${pkg_file}"
                return 0
              fi
            done
          }

          for pkg in ipset luci-lib-jsonc luci-compat coreutils coreutils-base64 \
                     shadowsocks-libev-ss-local shadowsocks-libev-ss-redir \
                     libev libsodium libudns libpcre libmbedtls12; do
            fetch_ipk "$pkg"
          done

          echo "XRAY_VER=v${XRAY_VER}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: 3. 生成安装脚本并封装 Makeself (--gzip)
        run: |
          set -euo pipefail
          PKG_DIR="${GITHUB_WORKSPACE}/build_tmp/payload"

          sed 's/^          //' << 'EOF' > "${PKG_DIR}/install.sh"
          #!/bin/sh
          set -e

          echo "=========================================================="
          echo " SSR Plus+ 极简中文版 (MT7621 / OpenWrt 22.03 & GL.iNet 4.x)"
          echo "=========================================================="

          sync && echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true

          echo ">>> [1/3] 匹配当前内核安装 TProxy 与 nftables 透明代理组件..."
          opkg update || true
          opkg install kmod-ipt-tproxy kmod-nft-socket iptables-nft ipset --force-overwrite || true

          echo ">>> [2/3] 校验并自愈系统原厂 curl（防止订阅拉取失败）..."
          if [ ! -x /usr/bin/curl ] && [ -f /rom/usr/bin/curl ]; then
              cp -f /rom/usr/bin/curl /usr/bin/curl
              chmod +x /usr/bin/curl
          fi
          if ! curl --version >/dev/null 2>&1; then
              opkg install libnghttp2-14 libcurl4 --force-overwrite || true
          fi

          echo ">>> [3/3] 统一通过 opkg 注册安装 luci-app-ssr-plus、xray-core 与 SS 核心..."
          opkg install ./ipks/*.ipk --force-depends --force-overwrite

          /etc/init.d/rpcd restart 2>/dev/null || true
          sync && echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true

          echo "=========================================================="
          echo " 安装完成！后台路径: 服务 -> ShadowSocksR Plus+"
          echo "=========================================================="
          EOF

          chmod +x "${PKG_DIR}/install.sh"
          makeself --gzip --notemp "${PKG_DIR}" "${GITHUB_WORKSPACE}/${OUTPUT_NAME}" "SSR-Plus-Lite MT7621" ./install.sh

      - name: 4. 清理旧的 Release 与 Tag（确保只保留最新一版）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${RELEASE_TAG}" 2>/dev/null || true

      - name: 5. 发布固定单版到 GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SSR-Plus Lite zh-CN MT7621 (Latest)"
          body: |
            - **构建时间**：`${{ env.BUILD_TIME }}`
            - **目标硬件**：MT7621 (`mipsel_24kc` / Softfloat)
            - **目标系统**：OpenWrt 22.03 / GL.iNet 4.x（原生 `fw4` / `iptables-nft` + `kmod-nft-socket` + `ipset`）
            - **集成核心**：`shadowsocks-libev` + `xray-core` `${{ env.XRAY_VER }}`（软浮点版）
            - **内置特性**：内置简体中文语言包（`.lmo`）、保留 `gen_config.lua`、内置并校验 `url.lua`、保护并自愈原厂 `curl`、全部组件标准 `.ipk` 注册（支持后台一键卸载）。
          files: |
            ${{ github.workspace }}/${{ env.OUTPUT_NAME }}
