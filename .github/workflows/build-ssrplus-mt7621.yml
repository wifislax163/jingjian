name: Build SSR-Plus Lite (MT7621 / GL.iNet 4.x & OpenWrt 22.03)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release 标签 (留空则自动使用日期时间戳)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ssrplus-mt7621.yml'

permissions:
  contents: write

env:
  ARCH: mipsel_24kc
  OPENWRT_VER: 22.03.4
  OUTPUT_NAME: ssrplus-mt7621-lite.run

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar unzip jq makeself

      - name: 2. 裁剪 luci-app-ssr-plus 源码并打包用户态依赖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK_DIR="${GITHUB_WORKSPACE}/build_tmp"
          PKG_DIR="${WORK_DIR}/payload"
          IDX_DIR="${WORK_DIR}/indices"
          mkdir -p "${PKG_DIR}/ipks" "${PKG_DIR}/bins" "${PKG_DIR}/luci" "${IDX_DIR}"

          # 拉取并裁剪 luci-app-ssr-plus
          curl -fSL "https://github.com/fw876/helloworld/archive/refs/heads/master.tar.gz" -o "${WORK_DIR}/helloworld.tar.gz"
          tar -xzf "${WORK_DIR}/helloworld.tar.gz" -C "${WORK_DIR}"

          SRC_SSR="${WORK_DIR}/helloworld-master/luci-app-ssr-plus"
          DST_LUCI="${PKG_DIR}/luci"

          mkdir -p "${DST_LUCI}/usr/lib/lua/luci"
          cp -rf "${SRC_SSR}/root/"* "${DST_LUCI}/"
          cp -rf "${SRC_SSR}/luasrc/"* "${DST_LUCI}/usr/lib/lua/luci/"

          rm -f "${DST_LUCI}/usr/lib/lua/luci/model/cbi/shadowsocksr/server.lua" \
                "${DST_LUCI}/usr/lib/lua/luci/model/cbi/shadowsocksr/server-config.lua" \
                "${DST_LUCI}/usr/share/shadowsocksr/gen_config.lua" \
                "${DST_LUCI}/usr/share/shadowsocksr/netflix_check.sh" \
                "${DST_LUCI}/usr/share/shadowsocksr/gfw2ipset.sh" 2>/dev/null || true

          find "${DST_LUCI}/etc/shadowsocksr" -type f \( -name "*ad*" -o -name "*netflix*" -o -name "*disney*" \) -delete 2>/dev/null || true
          sed -i '/"server"/d;/server-config/d;/netflix/d' "${DST_LUCI}/usr/lib/lua/luci/controller/shadowsocksr.lua"

          # 仅下载与内核无关的用户态 IPK (OpenWrt 22.03.4 mipsel_24kc)
          BASE_FEED="https://archive.openwrt.org/releases/${OPENWRT_VER}/packages/${ARCH}"
          curl -fSL "${BASE_FEED}/base/Packages" -o "${IDX_DIR}/base.idx"
          curl -fSL "${BASE_FEED}/packages/Packages" -o "${IDX_DIR}/packages.idx"
          curl -fSL "${BASE_FEED}/luci/Packages" -o "${IDX_DIR}/luci.idx"

          fetch_ipk() {
            local pkg_name="$1"
            local idx_file url_base pkg_file
            for pair in \
              "${IDX_DIR}/base.idx|${BASE_FEED}/base" \
              "${IDX_DIR}/packages.idx|${BASE_FEED}/packages" \
              "${IDX_DIR}/luci.idx|${BASE_FEED}/luci"; do
              idx_file="${pair%%|*}"
              url_base="${pair##*|}"
              pkg_file=$(awk -v p="$pkg_name" '$1=="Package:" && $2==p {found=1; next} found && $1=="Filename:" {print $2; exit} found && /^$/ {found=0}' "$idx_file")
              if [ -n "$pkg_file" ]; then
                curl -fSL "${url_base}/${pkg_file}" -o "${PKG_DIR}/ipks/${pkg_file}"
                return 0
              fi
            done
          }

          for pkg in ipset luci-lib-jsonc luci-compat coreutils-base64 \
                     shadowsocks-libev-ss-local shadowsocks-libev-ss-redir \
                     libev libsodium libudns libpcre libmbedtls12; do
            fetch_ipk "$pkg"
          done

          # 获取 Xray-core (mips32le)
          XRAY_JSON=$(curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/XTLS/Xray-core/releases/latest")
          XRAY_VER=$(echo "$XRAY_JSON" | jq -r '.tag_name')
          XRAY_URL=$(echo "$XRAY_JSON" | jq -r '.assets[] | select(.name | test("Xray-linux-mips32le\\.zip$")) | .browser_download_url' | head -n 1)
          curl -fSL "$XRAY_URL" -o "${WORK_DIR}/xray.zip"
          unzip -q "${WORK_DIR}/xray.zip" xray -d "${PKG_DIR}/bins/"
          chmod +x "${PKG_DIR}/bins/xray"
          echo "XRAY_VER=${XRAY_VER}" >> "$GITHUB_ENV"

      - name: 3. 生成兼容脚本并封装 Makeself (--gzip)
        run: |
          set -euo pipefail
          PKG_DIR="${GITHUB_WORKSPACE}/build_tmp/payload"

          sed 's/^          //' << 'EOF' > "${PKG_DIR}/install.sh"
          #!/bin/sh
          set -e

          echo "=========================================================="
          echo " SSR Plus+ 极简版 (MT7621 / GL.iNet 4.x & OpenWrt 22.03)"
          echo "=========================================================="

          sync && echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true

          echo ">>> [1/4] 安装用户态依赖与 shadowsocks-libev..."
          opkg install ./ipks/*.ipk --force-depends --force-overwrite || true

          echo ">>> [2/4] 匹配当前内核安装 TProxy 与 fw4 兼容组件..."
          opkg update || true
          opkg install kmod-ipt-tproxy iptables-nft ipset --force-overwrite || true

          echo ">>> [3/4] 部署 xray 与裁剪版 LuCI..."
          cp -f ./bins/xray /usr/bin/xray
          chmod 755 /usr/bin/xray
          ln -sf /usr/bin/xray /usr/bin/trojan 2>/dev/null || true

          cp -rf ./luci/* /
          chmod +x /etc/init.d/shadowsocksr /usr/share/shadowsocksr/*.sh 2>/dev/null || true

          if [ -f /etc/uci-defaults/luci-ssr-plus ]; then
              sh /etc/uci-defaults/luci-ssr-plus && rm -f /etc/uci-defaults/luci-ssr-plus
          fi

          echo ">>> [4/4] 刷新缓存并启用服务..."
          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache/*
          /etc/init.d/shadowsocksr enable
          /etc/init.d/rpcd restart 2>/dev/null || true

          echo "=========================================================="
          echo " 安装完成！请进入路由器后台 -> 服务 -> 影梭R Plus+"
          echo "=========================================================="
          EOF

          chmod +x "${PKG_DIR}/install.sh"
          makeself --gzip --notemp "${PKG_DIR}" "${GITHUB_WORKSPACE}/${OUTPUT_NAME}" "SSR-Plus-Lite MT7621" ./install.sh

      - name: 4. 生成 Release 版本号
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=v$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: 5. 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "SSR-Plus Lite MT7621 (OpenWrt 22.03 / GL.iNet 4.x) - ${{ steps.tag.outputs.TAG }}"
          files: |
            ${{ github.workspace }}/${{ env.OUTPUT_NAME }}
